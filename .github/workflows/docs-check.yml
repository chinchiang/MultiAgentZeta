name: docs-check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit, as the toolkit's own tools are pinned by digest (TK-SUP-002).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
      # The Python the lock file's hashes were recorded for (toolkit/requirements.lock).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - name: Test docs tooling
        run: python3 -I -m unittest discover -s docs/toolkit/tools -v
      - name: Validate toolkit docs
        run: python3 -I docs/toolkit/tools/build.py --check
      - name: Version rule, commit by commit
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: origin/${{ github.event.repository.default_branch }}
        run: python3 -I docs/toolkit/tools/build.py --check-commits "$BASE" --fallback "$DEFAULT_BRANCH"
      - name: Install toolkit dependencies (hash-pinned)
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: -r toolkit/requirements.lock
      - name: Test toolkit (fast tests; environment tests need MAZ_ENV_TESTS=1 and Docker)
        run: .venv/bin/python -I -m unittest discover -s toolkit/tests -t . -v
